@import url('https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap');
.tdl-root, .tdl-root input, .tdl-root select, .tdl-root textarea, .tdl-root button {
  font-family: 'Noto Sans Thai', 'IBM Plex Mono', sans-serif;
}
.tdl-display { font-family: 'Kanit', 'Noto Sans Thai', sans-serif; }
.tdl-mono { font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.01em; }
.tdl-scroll::-webkit-scrollbar { width: 8px; height: 8px; }
.tdl-scroll::-webkit-scrollbar-thumb { background: #D7DEEA; border-radius: 8px; }
.tdl-fade-in { animation: tdlFadeIn .22s ease both; }
@keyframes tdlFadeIn { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform:none;} }
